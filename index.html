<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Almacén Privado</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; }
    .pantalla-bloqueo { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
    .contenedor { max-width: 900px; margin: 0 auto; background-color: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; }
    h1 { color: #1f2937; text-align: center; }
    .formulario { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input { padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; flex-grow: 1; outline: none; }
    button { padding: 12px 20px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-entrar { background-color: #111827; width: 200px; margin-top: 10px; }
    .btn-agregar { background-color: #059669; }
    .btn-accion { background-color: #3b82f6; padding: 8px 12px; margin: 2px; }
    .btn-borrar { background-color: #ef4444; padding: 8px 12px; margin: 2px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e5e7eb; }
    th { background-color: #f9fafb; color: #4b5563; }
    @media (max-width: 600px) {
      .formulario { flex-direction: column; }
      th, td { padding: 8px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE SEGURIDAD -->
  <div id="pantalla-bloqueo" class="pantalla-bloqueo">
    <h2>Acceso Restringido</h2>
    <input type="password" id="pin-acceso" placeholder="Ingresa tu clave secreta">
    <button class="btn-entrar" onclick="verificarAcceso()">Entrar al Sistema</button>
  </div>

  <!-- SISTEMA DE INVENTARIO -->
  <div id="sistema-inventario" class="contenedor">
    <h1>Inventario en Tiempo Real</h1>
    
    <div class="formulario">
      <input type="text" id="nombre-producto" placeholder="Ej: Micronutrientes (gramos)...">
      <input type="number" id="cantidad-producto" placeholder="Stock" style="max-width: 150px;">
      <button class="btn-agregar" id="btn-guardar">Agregar Producto</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Stock Actual</th>
          <th>Control</th>
        </tr>
      </thead>
      <tbody id="tabla-productos">
        <!-- Los datos de la nube aparecerán aquí -->
      </tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // ESTAS SON TUS LLAVES REALES
    const firebaseConfig = {
      apiKey: "AIzaSyAayaAD_7oTb5xBeX-Z0pAXR1yxqnk53-k",
      authDomain: "hidrohuerto-control-almacen.firebaseapp.com",
      databaseURL: "https://hidrohuerto-control-almacen-default-rtdb.firebaseio.com",
      projectId: "hidrohuerto-control-almacen",
      storageBucket: "hidrohuerto-control-almacen.firebasestorage.app",
      messagingSenderId: "464478782607",
      appId: "1:464478782607:web:c1d804fc1932109ec25cfa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const almacenRef = ref(db, 'inventario');

    document.getElementById('btn-guardar').addEventListener('click', () => {
      const nombre = document.getElementById('nombre-producto').value;
      const cantidad = document.getElementById('cantidad-producto').value;
      
      if(nombre !== "" && cantidad !== "") {
        const nuevoProducto = push(almacenRef);
        set(nuevoProducto, { nombre: nombre, stock: parseInt(cantidad) });
        document.getElementById('nombre-producto').value = '';
        document.getElementById('cantidad-producto').value = '';
      }
    });

    onValue(almacenRef, (snapshot) => {
      const tabla = document.getElementById('tabla-productos');
      tabla.innerHTML = ''; 
      
      snapshot.forEach((hijo) => {
        const id = hijo.key;
        const producto = hijo.val();
        
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td><strong>${producto.nombre}</strong></td>
          <td style="font-size: 1.2em; font-weight: bold;">${producto.stock}</td>
          <td>
            <button class="btn-accion" onclick="modificarStock('${id}', ${producto.stock + 1})">+1</button>
            <button class="btn-accion" onclick="modificarStock('${id}', ${producto.stock - 1})">-1</button>
            <button class="btn-borrar" onclick="eliminarProducto('${id}')">X</button>
          </td>
        `;
        tabla.appendChild(fila);
      });
    });

    window.modificarStock = function(id, nuevoStock) {
      update(ref(db, 'inventario/' + id), { stock: nuevoStock });
    };
    window.eliminarProducto = function(id) {
      if(confirm("¿Estás seguro de eliminar este producto?")) {
        remove(ref(db, 'inventario/' + id));
      }
    };
  </script>

  <script>
    function verificarAcceso() {
      const pinIngresado = document.getElementById('pin-acceso').value;
      const PIN_SECRETO = "7070"; 
      
      if (pinIngresado === PIN_SECRETO) {
        document.getElementById('pantalla-bloqueo').style.display = 'none';
        document.getElementById('sistema-inventario').style.display = 'block';
      } else {
        alert("Clave incorrecta. Acceso denegado.");
        document.getElementById('pin-acceso').value = '';
      }
    }
  </script>
</body>
</html>
